# Example 03: dev1 of connections-app, plus the systems it connects to at startup, all in this one compose project:
#   config-server   serves config-repo/ (connections-app.yml, connections-app-dev1.yml)
#   vault           dev mode, in memory: ./bootstrap.sh writes dev1's Mongo password, policy and token after each start
#   mongo           dev1's database + user, created by ./bootstrap.sh
#   app-dev1        the image, configured only by env vars + its Vault token (.secrets/dev1.env)
# Only the app publishes a port; the app and bootstrap.sh reach the others by service name.
#
# By hand (from this folder):
#   docker compose up -d --wait --build config-server vault mongo
#   ./bootstrap.sh dev1
#   docker compose up -d app-dev1          # http://localhost:8301/info/connections
#   docker compose down
#
# Demo-only credentials (Vault root token, Mongo root password). Never do this for real.

name: aot-03-startup-connections

services:
  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    image: aot-03-config-server:1.0.0
    volumes:
      - ./config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8888/actuator/health"]
      interval: 2s
      retries: 60

  vault:
    image: hashicorp/vault:2.1
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      retries: 60

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      retries: 60

  app-dev1:
    image: connections-app:1.0.0
    pull_policy: never
    restart: "no"
    depends_on:
      config-server: { condition: service_healthy }
      vault: { condition: service_healthy }
      mongo: { condition: service_healthy }
    environment:
      APP_ENV: dev
      APP_ENV_INDEX: "1"
      CONFIG_SERVER_URL: http://config-server:8888
      VAULT_ADDR: http://vault:8200
    env_file:
      - path: .secrets/dev1.env   # VAULT_TOKEN, written by ./bootstrap.sh
        required: false
    ports:
      - "8301:8080"
