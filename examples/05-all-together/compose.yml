# Example 05: four "environments" running the SAME demo-app image against the shared
# infrastructure (infra/compose.yml: Config Server, Vault, Mongo on the aot-infra network).
# Each environment differs only in env vars: which profile it is, where its servers are,
# its own Vault token (written by infra/bootstrap.sh) and its JVM flags.

name: aot-05-all-together

networks:
  default:
    name: aot-infra
    external: true

x-app: &app
  image: demo-app:1.0.0
  pull_policy: never
  mem_limit: 768m
  restart: "no"

x-app-env: &app-env
  CONFIG_SERVER_URL: http://config-server:8888
  VAULT_ADDR: http://vault:8200

services:
  app-dev1:
    <<: *app
    build:            # the only service that builds the image; the others reuse it
      context: ../..
      dockerfile: docker/app.Dockerfile
      args:
        MODULE: examples/05-all-together/app
        APP: demo-app
        REVISION: ${REVISION:-unknown}
    environment:
      <<: *app-env
      APP_ENV: dev
      APP_ENV_INDEX: "1"
      JDK_JAVA_OPTIONS: -XX:+UseG1GC -Xmx256m -XX:+ExitOnOutOfMemoryError
    env_file:
      - path: ../../.secrets/demo-app/dev1.env
        required: false
    ports:
      - "8081:8080"

  app-dev2:
    <<: *app
    environment:
      <<: *app-env
      APP_ENV: dev
      APP_ENV_INDEX: "2"
      # Deliberately different GC: on JDK 25 the AOT cache can't be used with ZGC, so this
      # environment shows the fallback (a warning, then a normal, slower start).
      JDK_JAVA_OPTIONS: -XX:+UseZGC -Xmx256m -XX:+ExitOnOutOfMemoryError
    env_file:
      - path: ../../.secrets/demo-app/dev2.env
        required: false
    ports:
      - "8082:8080"

  app-qa1:
    <<: *app
    environment:
      <<: *app-env
      APP_ENV: qa
      APP_ENV_INDEX: "1"
      JDK_JAVA_OPTIONS: -XX:+UseG1GC -Xmx384m -XX:+ExitOnOutOfMemoryError
    env_file:
      - path: ../../.secrets/demo-app/qa1.env
        required: false
    ports:
      - "8083:8080"

  app-prod1:
    <<: *app
    environment:
      <<: *app-env
      APP_ENV: prod
      APP_ENV_INDEX: "1"
      # No JDK_JAVA_OPTIONS: prod runs with the image's default flags, the ones the AOT cache was trained with.
    env_file:
      - path: ../../.secrets/demo-app/prod1.env
        required: false
    ports:
      - "8084:8080"
