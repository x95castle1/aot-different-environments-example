# The TRAINING stack: throwaway services + the app whose AOT cache is being recorded.
#
#   config-server, vault, mongo   the same kinds of systems the app connects to in every environment, but
#                                 disposable, with fake data, and no host ports (nothing clashes with the
#                                 environments in ../compose.yml). The Config Server is this example's own
#                                 (../config-server) serving training/config-repo. Seeded by ../bootstrap.sh;
#                                 deleted after every training run.
#   trainer                       workload-app:untrained, started with -XX:AOTCacheOutput so the JVM records
#                                 what runs while run-workload.sh sends it requests. Stopping it cleanly
#                                 (docker compose stop trainer) makes the JVM write /tmp/app.aot on exit.
#
# By hand (from examples/06-training-workload/):
#   docker compose -f training/compose.yml up -d --wait config-server vault mongo
#   COMPOSE_FILE=training/compose.yml ./bootstrap.sh training
#   docker compose -f training/compose.yml up -d trainer
#   ./run-workload.sh http://localhost:8601 3000 8
#   docker compose -f training/compose.yml stop trainer
#   docker compose -f training/compose.yml cp trainer:/tmp/app.aot out/app.aot
#   docker compose -f training/compose.yml down -v

name: aot-06-training

networks:
  default:
    name: aot-06-training

services:
  config-server:
    build:
      context: ..
      dockerfile: config-server/Dockerfile
    image: aot-06-config-server:1.0.0
    volumes:
      - ./config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8888/actuator/health"]
      interval: 2s
      retries: 60

  vault:
    image: hashicorp/vault:2.1
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      retries: 60

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      retries: 60

  trainer:
    image: workload-app:untrained
    pull_policy: never
    depends_on:
      config-server: { condition: service_healthy }
      vault: { condition: service_healthy }
      mongo: { condition: service_healthy }
    # The image's ENTRYPOINT, with -XX:AOTCacheOutput instead of -XX:AOTCache: record a cache instead of using one.
    # Spring AOT on, and the prod JVM flags come from the image's JDK_JAVA_OPTIONS, exactly as in prod.
    # -Xmx1g: this container has no memory limit, so MaxRAMPercentage=75 would size the heap from the CI machine's
    # RAM; above ~43 GB that switches compressed oops off and no normal-sized environment could use the cache.
    entrypoint: ["java", "-XX:AOTCacheOutput=/tmp/app.aot", "-Xmx1g", "-Dspring.aot.enabled=true", "-jar", "/app/app.jar"]
    environment:
      APP_ENV: training                          # -> profile "training": training/config-repo/workload-app-training.yml
      CONFIG_SERVER_URL: http://config-server:8888
      VAULT_ADDR: http://vault:8200
    env_file:
      - path: ../.secrets/training.env   # VAULT_TOKEN, written by ../bootstrap.sh
        required: false
    # On stop: SIGTERM -> Spring's graceful shutdown -> normal JVM exit -> JDK 25 assembles the cache in a child
    # JVM (a few seconds). The long grace period makes sure it's never killed before the cache is written.
    stop_grace_period: 300s
    ports:
      - "8601:8080"
