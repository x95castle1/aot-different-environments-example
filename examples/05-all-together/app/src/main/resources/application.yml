# Baked into the image and identical in every environment.
# Anything environment-specific arrives at startup from:
#   - APP_ENV / APP_ENV_INDEX         -> active profiles (EnvironmentProfilesPostProcessor)
#   - Config Server                    -> demo-app-{profile}.yml (Mongo host/db/user, audit sink)
#   - Vault                            -> secret/demo-app/{profile} (Mongo password, API key)
#   - env vars                         -> where those servers are and how to log in to them
spring:
  application:
    name: demo-app
  config:
    import:
      # 'optional:' only lets the build (no network) skip them. At runtime fail-fast=true below
      # overrides it, so a missing Config Server or Vault stops the app at startup.
      - "optional:configserver:"
      - "optional:vault://"
  cloud:
    config:
      uri: ${CONFIG_SERVER_URL:http://localhost:8888}
      fail-fast: true
    vault:
      uri: ${VAULT_ADDR:http://localhost:8200}
      authentication: TOKEN
      token: ${VAULT_TOKEN:}
      fail-fast: true
      kv:
        enabled: true
        backend: secret
        application-name: demo-app
        # Read only secret/demo-app and secret/demo-app/{profile}, not the shared secret/application.
        default-context: demo-app
    # Refresh scope can't work with Spring AOT (the bean graph is fixed), so it has to be off.
    refresh:
      enabled: false

app:
  audit:
    sink: log

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
