# Example 05: four "environments" running the SAME demo-app image, plus the systems they connect to at startup,
# all in this one compose project:
#   config-server   serves config-repo/ (demo-app.yml, demo-app-<tier>.yml, demo-app-<env>.yml)
#   vault           dev mode, in memory: ./bootstrap.sh writes each env's secrets, policy and token after each start
#   mongo           one database + user per environment, created by ./bootstrap.sh
#   app-<env>       differ only in env vars: which profile it is, where its servers are, its own Vault token
#                   (.secrets/<env>.env) and its JVM flags
# Only the apps publish ports; the apps and bootstrap.sh reach the others by service name.
#
# By hand (from this folder): make start, or
#   docker compose up -d --wait --build config-server vault mongo
#   ./bootstrap.sh dev1 dev2 qa1 prod1
#   docker compose up -d --build app-dev1 app-dev2 app-qa1 app-prod1
#
# Demo-only credentials (Vault root token, Mongo root password). Never do this for real.

name: aot-05-all-together

x-app: &app
  image: demo-app:1.0.0
  pull_policy: never
  mem_limit: 768m
  restart: "no"
  depends_on:
    config-server: { condition: service_healthy }
    vault: { condition: service_healthy }
    mongo: { condition: service_healthy }

x-app-env: &app-env
  CONFIG_SERVER_URL: http://config-server:8888
  VAULT_ADDR: http://vault:8200

services:
  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    image: aot-05-config-server:1.0.0
    volumes:
      - ./config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8888/actuator/health"]
      interval: 2s
      retries: 60

  vault:
    image: hashicorp/vault:2.1
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      retries: 60

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      retries: 60

  app-dev1:
    <<: *app
    build:            # the only app service that builds the image (Dockerfile); the others reuse it
      context: .
      args:
        REVISION: ${REVISION:-unknown}
    environment:
      <<: *app-env
      APP_ENV: dev
      APP_ENV_INDEX: "1"
      JDK_JAVA_OPTIONS: -XX:+UseG1GC -Xmx256m -XX:+ExitOnOutOfMemoryError
    env_file:
      - path: .secrets/dev1.env
        required: false
    ports:
      - "8081:8080"

  app-dev2:
    <<: *app
    environment:
      <<: *app-env
      APP_ENV: dev
      APP_ENV_INDEX: "2"
      # Deliberately different GC: on JDK 25 the AOT cache can't be used with ZGC, so this
      # environment shows the fallback (a warning, then a normal, slower start).
      JDK_JAVA_OPTIONS: -XX:+UseZGC -Xmx256m -XX:+ExitOnOutOfMemoryError
    env_file:
      - path: .secrets/dev2.env
        required: false
    ports:
      - "8082:8080"

  app-qa1:
    <<: *app
    environment:
      <<: *app-env
      APP_ENV: qa
      APP_ENV_INDEX: "1"
      JDK_JAVA_OPTIONS: -XX:+UseG1GC -Xmx384m -XX:+ExitOnOutOfMemoryError
    env_file:
      - path: .secrets/qa1.env
        required: false
    ports:
      - "8083:8080"

  app-prod1:
    <<: *app
    environment:
      <<: *app-env
      APP_ENV: prod
      APP_ENV_INDEX: "1"
      # No JDK_JAVA_OPTIONS: prod runs with the image's default flags, the ones the AOT cache was trained with.
    env_file:
      - path: .secrets/prod1.env
        required: false
    ports:
      - "8084:8080"
